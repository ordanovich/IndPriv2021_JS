<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas de Privación de España</title>
    <link rel="icon" href="favicon.ico" />
    <!-- Loader shown before the app's code arrives (React replaces it); same
         look as the map loader (.map-loader in styles.css) -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
              gap: 16px; color: #111827; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif;
              background: radial-gradient(circle at 50% 45%, #ffffff 0%, #f1f5f9 70%, #e8edf3 100%); }
      .boot img { height: 44px; width: auto; mix-blend-mode: multiply; }
      .boot .bars { display: flex; align-items: flex-end; gap: 6px; height: 40px; }
      .boot .bars b { width: 12px; height: 100%; border-radius: 6px; transform-origin: bottom;
                      animation: boot-wave 1.1s ease-in-out infinite; }
      .boot .bars b:nth-child(1) { background: #1a9850; }
      .boot .bars b:nth-child(2) { background: #91cf60; animation-delay: .12s; }
      .boot .bars b:nth-child(3) { background: #fee08b; animation-delay: .24s; }
      .boot .bars b:nth-child(4) { background: #fc8d59; animation-delay: .36s; }
      .boot .bars b:nth-child(5) { background: #d73027; animation-delay: .48s; }
      @keyframes boot-wave { 0%, 100% { transform: scaleY(.3); opacity: .45; } 50% { transform: scaleY(1); opacity: 1; } }
      .boot span:last-child { animation: boot-breathe 1.6s ease-in-out infinite; }
      @keyframes boot-breathe { 50% { opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .boot .bars b, .boot span:last-child { animation: none; } .boot .bars b { transform: scaleY(.7); } }
      /* Animated version (?intro=1): only the splash's background until it takes over */
      html[data-intro] .boot { background: #f6f8fb; }
      html[data-intro] .boot > * { display: none; }
    </style>
    <script>
      try {
        if (new URLSearchParams(location.search).get("intro") === "1" && !matchMedia("(prefers-reduced-motion: reduce)").matches)
          document.documentElement.dataset.intro = "pending";
      } catch (_) {}
    </script>
    <script type="module" crossorigin src="./assets/index-DOAyWBv6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DD-BoxHX.css">
  </head>
  <body>
    <div id="root"><div class="boot" role="status"><img src="images/logo.jpg" alt="Sociedad Española de Epidemiología" /><span class="bars" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></span><span>Cargando el mapa…</span></div></div>
  </body>
</html>
